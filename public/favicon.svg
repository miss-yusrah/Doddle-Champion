<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Doodle Champion">
  <!-- paper -->
  <rect width="64" height="64" rx="12" fill="#f0efe9"/>
  <!-- faint fold -->
  <line x1="8" y1="30" x2="56" y2="30" stroke="#d8a02a" stroke-width="1.5" stroke-dasharray="3 3" opacity=".45"/>
  <!-- doodle figure -->
  <g fill="none" stroke="#22262b" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="32" cy="18" r="7"/>
    <path d="M32 25 v16"/>
    <path d="M32 30 l-11 7"/>
    <path d="M32 30 l11 7"/>
    <path d="M32 41 l-9 12"/>
    <path d="M32 41 l9 12"/>
  </g>
  <!-- gold smile slash -->
  <path d="M24 22 q8 4 16 0" fill="none" stroke="#c9455f" stroke-width="2.4" stroke-linecap="round"/>
  <!-- gold caret under feet -->
  <path d="M26 58 L32 52 L38 58" fill="none" stroke="#d8a02a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- mini pencil -->
  <g transform="translate(46,8) rotate(35)">
    <path d="M0 10 L8 2 l3 3 -8 8 -4 1 z" fill="#e8b33c" stroke="#22262b" stroke-width="1.2" stroke-linejoin="round"/>
    <path d="M-1 14 l4-1 -3-3 z" fill="#22262b"/>
    <path d="M8 2 l3 3 2-2 -3-3 z" fill="#d98ca0" stroke="#22262b" stroke-width="1"/>
  </g>
</svg>
